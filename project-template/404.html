<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found — PROJECT_NAME</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="/assets/icons/favicon.ico" sizes="any" />
  <link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml" />
  <meta name="theme-color" content="#0d1117" />
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    .not-found { display:flex; flex-direction:column; align-items:center;
      justify-content:center; min-height:60dvh; text-align:center; padding:3rem 1.25rem; }
    .not-found__code { font-size:clamp(4rem,15vw,8rem); font-weight:900;
      color:var(--color-border); line-height:1; letter-spacing:-.06em; }
    .not-found__title { font-size:1.5rem; font-weight:700; margin:.75rem 0 .5rem; }
    .not-found__desc { color:var(--color-muted); margin-bottom:2rem; max-width:400px; }
  </style>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <header class="site-header" role="banner">
    <div class="container">
      <nav class="nav" aria-label="Primary navigation">
        <a class="nav__logo" href="/">PROJECT_NAME</a>
      </nav>
    </div>
  </header>
  <main id="main-content">
    <div class="not-found">
      <div class="not-found__code" aria-hidden="true">404</div>
      <h1 class="not-found__title">Page not found</h1>
      <p class="not-found__desc">The page you're looking for doesn't exist or has been moved.</p>
      <a href="/" class="btn btn--primary">Go to homepage</a>
    </div>
  </main>
  <footer class="site-footer" role="contentinfo">
    <div class="container">
      <div class="footer__inner">
        <span>&copy; <span id="copyright-year"></span> <a href="https://universeinvedors.tech/">universeinvedors.tech</a>.</span>
      </div>
    </div>
  </footer>
  <script src="/js/main.js" defer></script>
</body>
</html>
